</style></head><body><header class="top"><div><div class="heading">Online Quiz</div><div class="sub">2627 SABIS® Mental Maths • Term 1 • Week 7 • Level F</div></div><div class="stats"><div><small>Time Spent</small><div class="time" id="timer">00 : 00 : 00</div></div><div class="circle"><strong id="count">0/40</strong><span>Quiz<br>Progress</span></div></div></header><main class="container"><div class="picker"><b>Choose a version:</b><button data-v="0">Version 1</button><button data-v="1">Version 2</button><button data-v="2">Version 3</button><button data-v="3">Version 4</button></div><p class="intro">Fill in the blanks to answer 40 questions.</p><div id="questions" class="questions"><div id="left" class="column"></div><div id="right" class="column"></div></div><section id="results" class="results" hidden><h2 id="score"></h2><p>Review your answers below. Incorrect and blank answers show the correct number.</p><div id="review" class="review"></div><p><button id="retry">Try Again</button></p></section></main><footer class="bottom"><button class="yellow" id="current">Version 1</button><div><button id="submit">Submit Quiz</button></div></footer><script>
const versions=[{"questions": ["3 + 16 = □", "□ + 9 = 18", "15 − 6 = □", "7 + 7 = □", "□ + 8 = 13", "7 + □ = 11", "□ + 4 = 9", "17 − 4 = □", "18 − 4 = □", "2 + □ = 5", "□ + 6 = 13", "12 − 3 = □", "□ + 3 = 6", "11 − □ = 8", "5 + 6 = □", "12 − 8 = □", "10 − □ = 6", "□ + 5 = 9", "13 − 9 = □", "12 − □ = 5", "15 + 5 = □", "8 + 3 = □", "□ + 7 = 15", "11 − □ = 6", "2 + □ = 11", "14 − 8 = □", "10 − 9 = □", "□ + 6 = 14", "□ + 7 = 13", "10 − □ = 8", "□ + 8 = 11", "12 − 6 = □", "2 + 8 = □", "6 + □ = 11", "13 − 5 = □", "□ + 9 = 10", "6 + 7 = □", "10 + □ = 12", "8 − 5 = □", "9 − 4 = □"], "correct": [19, 9, 9, 14, 5, 4, 5, 13, 14, 3, 7, 9, 3, 3, 11, 4, 4, 4, 4, 7, 20, 11, 8, 5, 9, 6, 1, 8, 6, 2, 3, 6, 10, 5, 8, 1, 13, 2, 3, 5]}, {"questions": ["□ + 6 = 13", "12 − 3 = □", "□ + 3 = 6", "11 − □ = 8", "5 + 6 = □", "12 − 8 = □", "10 − □ = 6", "□ + 5 = 9", "13 − 9 = □", "12 − □ = 5", "15 + 5 = □", "8 + 3 = □", "□ + 7 = 15", "11 − □ = 6", "2 + □ = 11", "14 − 8 = □", "10 − 9 = □", "□ + 6 = 14", "□ + 7 = 13", "10 − □ = 8", "□ + 8 = 11", "12 − 6 = □", "2 + 8 = □", "6 + □ = 11", "13 − 5 = □", "□ + 9 = 10", "6 + 7 = □", "10 + □ = 12", "8 − 5 = □", "9 − 4 = □", "3 + 16 = □", "□ + 9 = 18", "15 − 6 = □", "7 + 7 = □", "□ + 8 = 13", "7 + □ = 11", "□ + 4 = 9", "17 − 4 = □", "18 − 4 = □", "2 + □ = 5"], "correct": [7, 9, 3, 3, 11, 4, 4, 4, 4, 7, 20, 11, 8, 5, 9, 6, 1, 8, 6, 2, 3, 6, 10, 5, 8, 1, 13, 2, 3, 5, 19, 9, 9, 14, 5, 4, 5, 13, 14, 3]}, {"questions": ["15 + 5 = □", "8 + 3 = □", "□ + 7 = 15", "11 − □ = 6", "2 + □ = 11", "14 − 8 = □", "10 − 9 = □", "□ + 6 = 14", "□ + 7 = 13", "10 − □ = 8", "□ + 8 = 11", "12 − 6 = □", "2 + 8 = □", "6 + □ = 11", "13 − 5 = □", "□ + 9 = 10", "6 + 7 = □", "10 + □ = 12", "8 − 5 = □", "9 − 4 = □", "□ + 8 = 16", "10 + 2 = □", "15 + □ = 20", "10 − 5 = □", "□ + 3 = 10", "9 + 4 = □", "□ + 9 = 15", "14 − □ = 6", "18 − 9 = □", "5 + □ = 10", "8 + □ = 10", "6 + 8 = □", "□ + 9 = 14", "3 + □ = 11", "4 + □ = 13", "12 − 4 = □", "10 − □ = 6", "□ + 5 = 9", "14 − □ = 7", "6 + □ = 12 function timer(){let s=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(' : ')}setInterval(timer,1000);
function progress(){$('count').textContent=answers.filter(x=>x.trim()!=='').length+'/40'}
function render(){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',+b.dataset.v===current));$('current').textContent='Version '+(current+1);$('left').replaceChildren();$('right').replaceChildren();versions[current].questions.forEach((q,i)=>{let row=document.createElement('div');row.className='question';let n=document.createElement('span');n.className='qn';n.textContent=(i+1)+'.';let expr=document.createElement('span');expr.className='expr';let parts=q.split('□');let input=document.createElement('input');input.type='text';input.inputMode='numeric';input.autocomplete='off';input.setAttribute('aria-label','Answer question '+(i+1));input.value=answers[i];input.disabled=finished;input.addEventListener('input',()=>{answers[i]=input.value;progress()});expr.append(document.createTextNode(parts[0]),input,document.createTextNode(parts[1]||''));row.append(n,expr);$(i<20?'left':'right').append(row)});progress();$('submit').hidden=finished}
function choose(v){if(v===current)return;if(answers.some(x=>x.trim())&&!confirm('Switch versions? Your current answers will be cleared.'))return;current=v;answers=Array(40).fill('');finished=false;startTime=Date.now();$('results').hidden=true;render()}
